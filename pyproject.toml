[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-review"
version = "0.1.0"
description = "AI-powered, schema-enforced code review CLI for GitHub PRs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "PyGithub>=2.3",
    "anthropic>=0.34",
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ai-review = "ai_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_review"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
pythonpath = ["src"]
