name: "ai-review-cli"
description: "Schema-enforced AI code review, posted as PR comments"
branding:
  icon: "eye"
  color: "blue"
inputs:
  anthropic-api-key:
    description: "API key for the LLM"
    required: true
  min-severity:
    description: "Minimum severity to post (info|suggestion|warning|critical)"
    required: false
    default: "suggestion"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        # REQUIRED: fetcher.py runs `git diff <base-or-since-sha> <head-sha>`.
        # A shallow clone (the default) won't have those commits available
        # and `ai-review pr` will fail with a clear-but-avoidable error.
        # See diff/fetcher.py's module docstring for the full explanation.
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      # Pinned to the PyPI release matching this action's tag. Bump this
      # version string whenever a new tag/release is cut.
      run: pip install "ai-review-cli==0.1.0"
    - shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        ai-review pr \
          --repo "${{ github.repository }}" \
          --pr-number "${{ github.event.pull_request.number }}" \
          --min-severity "${{ inputs.min-severity }}"
